name: ci

# Runs the same check script available locally (node tools/ci-check.mjs)
# on every push to main and every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 仓库体检
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # shell 语法、全仓 LF、打包产物自洽一次跑完。
      # 打包走的是 build.mjs 本身，它在 Linux 上坏了这里立刻变红。
      - name: 语法 / 换行 / 打包自洽
        run: node tools/ci-check.mjs

      # 再用系统 unzip 过一遍：ci-check 自己解 ZIP 结构查 CRC 与反斜杠，
      # 但「别的解压器能不能读」是另一件事，两条都要绿。
      # 必须逐个测：unzip -t a.zip b.zip 会把 b.zip 当成 a.zip 的成员名去匹配。
      - name: unzip -t 完整性测试
        run: |
          set -euo pipefail
          for z in release/PianoMax-*.zip; do
            echo "== $z =="
            unzip -t "$z"
          done

      - name: 产物信息
        run: |
          ls -l release/
          echo '--- SHA-256 ---'
          sha256sum release/PianoMax-*.zip
